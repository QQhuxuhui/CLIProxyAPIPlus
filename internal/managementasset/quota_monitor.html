<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配额监控 · CLIProxyAPI</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .bar input[type=password] { flex: 1 1 320px; min-width: 220px; padding: 6px 8px; }
  button { padding: 6px 10px; cursor: pointer; }
  label { font-size: 13px; }
  #status { margin: 6px 0 12px; font-size: 13px; min-height: 18px; }
  #status.err { color: #c0392b; }
  #status.ok { color: #2e7d32; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; white-space: nowrap; }
  th { background: rgba(127,127,127,.15); position: sticky; top: 0; }
  .badge { padding: 1px 6px; border-radius: 4px; font-size: 12px; }
  .badge.q { background: #c0392b; color: #fff; }
  .muted { color: #888; }
  #empty { padding: 24px; text-align: center; color: #888; }
  #dashboard { margin: 8px 0 18px; }
  .cards { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 6px; }
  .card { border: 1px solid #ccc; border-radius: 8px; padding: 8px 14px; min-width: 90px; }
  .card .n { font-size: 22px; font-weight: 700; }
  .card .l { font-size: 12px; color: #888; }
  .charts { display: flex; flex-wrap: wrap; gap: 24px; margin: 10px 0; }
  .chart { flex: 1 1 280px; }
  .chart h2 { font-size: 13px; margin: 8px 0 6px; color: #888; }
  .donut { width: 140px; height: 140px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; }
  .donut::after { content: attr(data-total); width: 84px; height: 84px; background: Canvas; border-radius: 50%; display: grid; place-items: center; font-weight: 700; }
  .legend { display: flex; gap: 12px; justify-content: center; font-size: 12px; margin-top: 6px; }
  .legend span::before { content: "■ "; }
  .bars { display: flex; flex-direction: column; gap: 5px; }
  .bars .row { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .bars .row .lab { width: 88px; flex: none; color: #888; }
  .bars .row .track { flex: 1; background: rgba(127,127,127,.15); border-radius: 4px; height: 16px; overflow: hidden; display: flex; }
  .bars .row .seg { height: 16px; }
  .bars .row .val { width: 48px; flex: none; text-align: right; }
</style>
</head>
<body>
<h1>antigravity / 模型配额监控</h1>
<div class="bar">
  <input id="key" type="password" placeholder="管理 key（remote-management.secret-key 或 MANAGEMENT_PASSWORD）" autocomplete="off">
  <label><input id="remember" type="checkbox"> 记住 key</label>
  <button id="save">保存</button>
  <button id="clear">清除 key</button>
  <button id="refresh">刷新</button>
  <label><input id="auto" type="checkbox" disabled> 自动刷新(15s)</label>
  <span id="updated" class="muted"></span>
</div>
<div id="status"></div>
<section id="dashboard" hidden>
  <div id="dash-cards" class="cards"></div>
  <div id="dash-soonest" class="muted"></div>
  <div class="charts">
    <div class="chart"><h2>可用 / 冷却 / 禁用</h2><div id="dash-donut" class="donut"></div><div id="dash-legend" class="legend"></div></div>
    <div class="chart"><h2>冷却时间分布</h2><div id="dash-dist" class="bars"></div></div>
  </div>
  <div class="chart"><h2>各 provider</h2><div id="dash-prov" class="bars"></div></div>
</section>
<table id="table" hidden>
  <thead><tr>
    <th>provider</th><th>账号</th><th>model</th><th>quota</th><th>unavailable</th>
    <th>status</th><th>reason_code</th><th>upstream_model</th>
    <th>reset 倒计时</th><th>reset_at</th><th>next_retry_after</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
<div id="empty" hidden>当前无模型处于配额/冷却</div>
<script>
(function () {
  var KEY_NAME = 'cpa_quota_monitor_key';
  var ENDPOINT = '/v0/management/model-quota';
  var REFRESH_MS = 15000;
  var els = {};
  ['key','remember','save','clear','refresh','auto','updated','status','table','rows','empty'].forEach(function (id) { els[id] = document.getElementById(id); });
  var rowsData = [];
  var firstSuccess = false;
  var autoTimer = null;

  function getStoredKey() { return sessionStorage.getItem(KEY_NAME) || localStorage.getItem(KEY_NAME) || ''; }
  function setStatus(msg, kind) { els.status.textContent = msg || ''; els.status.className = kind || ''; }
  function stopAuto() { els.auto.checked = false; if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  function startAuto() { if (autoTimer) return; autoTimer = setInterval(fetchData, REFRESH_MS); }
  function readError(resp) {
    return resp.text().then(function (t) {
      if (!t) return '';
      try {
        var parsed = JSON.parse(t);
        if (parsed && parsed.error) return String(parsed.error);
        if (parsed && parsed.message) return String(parsed.message);
      } catch (e) {}
      return t;
    });
  }

  function saveKey() {
    var k = els.key.value.trim();
    if (!k) { setStatus('请填写管理 key', 'err'); return; }
    sessionStorage.setItem(KEY_NAME, k);
    if (els.remember.checked) { localStorage.setItem(KEY_NAME, k); } else { localStorage.removeItem(KEY_NAME); }
    setStatus('已保存', 'ok');
    fetchData();
  }
  function clearKey() {
    sessionStorage.removeItem(KEY_NAME); localStorage.removeItem(KEY_NAME);
    els.key.value = ''; stopAuto(); firstSuccess = false; els.auto.disabled = true;
    setStatus('key 已清除', '');
  }

  function fmtDur(ms) {
    if (ms <= 0) return '已恢复';
    var s = Math.floor(ms / 1000), d = Math.floor(s / 86400); s -= d * 86400;
    var h = Math.floor(s / 3600); s -= h * 3600; var m = Math.floor(s / 60); s -= m * 60;
    var out = ''; if (d) out += d + 'd '; if (d || h) out += h + 'h '; out += m + 'm ' + s + 's';
    return out;
  }

  function fetchData() {
    var k = getStoredKey();
    if (!k) { setStatus('请填写管理 key 后保存', 'err'); return; }   // Never send requests without a key to avoid failed-attempt bans.
    fetch(ENDPOINT, { headers: { 'Authorization': 'Bearer ' + k } }).then(function (resp) {
      if (resp.status === 401) {
        stopAuto(); els.auto.disabled = true; firstSuccess = false;
        return readError(resp).then(function (msg) {
          setStatus('管理 key 无效或缺失，请重新填写' + (msg ? '：' + msg : ''), 'err');
          els.key.focus();
          return null;
        });
      }
      if (resp.status === 403) {
        stopAuto(); els.auto.disabled = true; firstSuccess = false;
        return readError(resp).then(function (msg) {
          var lower = msg.toLowerCase();
          if (lower.indexOf('banned') >= 0 || lower.indexOf('too many failed') >= 0) {
            setStatus('已被临时封禁（管理 API 失败次数过多），请稍后再试。' + (msg ? ' ' + msg : ''), 'err');
          } else if (lower.indexOf('remote management disabled') >= 0) {
            setStatus('远程管理未开启：请在服务端启用 remote-management.allow-remote 后重试', 'err');
          } else if (lower.indexOf('management key not set') >= 0) {
            setStatus('管理 API 未配置 key：请先配置 remote-management.secret-key（或 MANAGEMENT_PASSWORD）后重试', 'err');
          } else {
            setStatus('管理 API 拒绝访问' + (msg ? '：' + msg : ''), 'err');
          }
          return null;
        });
      }
      if (resp.status === 404) { stopAuto(); els.auto.disabled = true; setStatus('管理 API 未启用：请先配置 remote-management.secret-key（或 MANAGEMENT_PASSWORD）后重试', 'err'); return null; }
      if (!resp.ok) { setStatus('请求失败：HTTP ' + resp.status, 'err'); return null; }
      return resp.json();
    }).then(function (data) {
      if (!data) return;
      firstSuccess = true; els.auto.disabled = false;
      render(data.accounts || []);
      fetchSummary(k);
      els.updated.textContent = '更新于 ' + new Date().toLocaleTimeString();
      setStatus('', '');
    }).catch(function (e) { setStatus('网络错误：' + e, 'err'); });
  }

  var COLORS = { available: '#2e7d32', cooling: '#c0392b', disabled: '#888' };

  function fetchSummary(k) {
    fetch('/v0/management/quota-summary', { headers: { 'Authorization': 'Bearer ' + k } })
      .then(function (resp) { return resp.ok ? resp.json() : null; })
      .then(function (data) { if (data) renderSummary(data); })
      .catch(function () {}); // 表格成功后才调用，错误这里不动防封禁状态
  }

  function card(n, label) { return '<div class="card"><div class="n">' + n + '</div><div class="l">' + label + '</div></div>'; }

  function renderSummary(d) {
    var p = d.pairs || {}, a = d.accounts || {};
    document.getElementById('dash-cards').innerHTML =
      card(p.total || 0, '总资源(账号×模型)') + card(p.available || 0, '可用') +
      card(p.cooling || 0, '冷却中') + card(p.disabled || 0, '禁用') +
      card(a.total || 0, '账号总数');
    // donut
    var tot = (p.available || 0) + (p.cooling || 0) + (p.disabled || 0);
    var av = pctOf(p.available, tot), co = pctOf(p.cooling, tot);
    var donut = document.getElementById('dash-donut');
    donut.style.background = 'conic-gradient(' + COLORS.available + ' 0 ' + av + '%,' +
      COLORS.cooling + ' ' + av + '% ' + (av + co) + '%,' + COLORS.disabled + ' ' + (av + co) + '% 100%)';
    donut.setAttribute('data-total', tot);
    document.getElementById('dash-legend').innerHTML =
      '<span style="color:' + COLORS.available + '">可用 ' + (p.available || 0) + '</span>' +
      '<span style="color:' + COLORS.cooling + '">冷却 ' + (p.cooling || 0) + '</span>' +
      '<span style="color:' + COLORS.disabled + '">禁用 ' + (p.disabled || 0) + '</span>';
    // distribution bars (single color)
    var dist = d.cooldown_distribution || [];
    var maxC = 1; dist.forEach(function (b) { if (b.count > maxC) maxC = b.count; });
    document.getElementById('dash-dist').innerHTML = dist.map(function (b) {
      var w = Math.round((b.count / maxC) * 100);
      return '<div class="row"><span class="lab">' + escapeHtml(b.bucket) + '</span>' +
        '<span class="track"><span class="seg" style="width:' + w + '%;background:' + COLORS.cooling + '"></span></span>' +
        '<span class="val">' + b.count + '</span></div>';
    }).join('');
    // per-provider stacked bars
    var prov = d.by_provider || [];
    document.getElementById('dash-prov').innerHTML = prov.map(function (r) {
      var t = r.total || 1;
      function seg(n, c) { return '<span class="seg" style="width:' + pctOf(n, t) + '%;background:' + c + '"></span>'; }
      return '<div class="row"><span class="lab">' + escapeHtml(r.provider || '') + '</span>' +
        '<span class="track">' + seg(r.available, COLORS.available) + seg(r.cooling, COLORS.cooling) + seg(r.disabled, COLORS.disabled) + '</span>' +
        '<span class="val">' + (r.total || 0) + '</span></div>';
    }).join('');
    // soonest recovery
    var sr = d.soonest_recovery;
    var soonestEl = document.getElementById('dash-soonest');
    if (sr && sr.recover_at) {
      var ms = new Date(sr.recover_at).getTime() - Date.now();
      soonestEl.textContent = '最近恢复: ' + (sr.provider || '') + '·' + (sr.model || '') + '  约 ' + fmtDur(ms) + ' 后';
    } else {
      soonestEl.textContent = '无即将恢复的资源';
    }
    document.getElementById('dashboard').hidden = false;
  }
  function pctOf(n, total) { return total > 0 ? Math.round((n || 0) / total * 100) : 0; }

  function render(accounts) {
    var rows = [];
    accounts.forEach(function (a) {
      (a.model_states || []).forEach(function (ms) {
        rows.push({
          provider: a.provider || '', auth: a.auth_index || a.id || '', email: a.email || a.label || '',
          model: ms.model || '', quota: !!ms.quota_exceeded, unavailable: !!ms.unavailable,
          status: ms.status || '', status_message: ms.status_message || '',
          reason: ms.reason_code || '', upstream: ms.upstream_model || '',
          reset_at: ms.reset_at || '', next: ms.next_retry_after || ''
        });
      });
    });
    rows.sort(function (x, y) { return (x.provider + '|' + x.auth + '|' + x.model).localeCompare(y.provider + '|' + y.auth + '|' + y.model); });
    rowsData = rows;
    if (!rows.length) { els.table.hidden = true; els.empty.hidden = false; return; }
    els.empty.hidden = true; els.table.hidden = false;
    paint();
  }

  function paint() {
    var now = Date.now();
    els.rows.innerHTML = rowsData.map(function (r) {
      var cd = r.reset_at ? fmtDur(new Date(r.reset_at).getTime() - now) : '';
      var acc = r.auth + (r.email ? ' (' + r.email + ')' : '');
      var st = r.status + (r.status_message ? ' / ' + r.status_message : '');
      return '<tr>' + td(r.provider) + td(acc) + td(r.model) +
        '<td>' + (r.quota ? '<span class="badge q">exhausted</span>' : '') + '</td>' +
        td(r.unavailable ? '是' : '') + td(st) + td(r.reason) + td(r.upstream) +
        td(cd) + td(r.reset_at) + td(r.next) + '</tr>';
    }).join('');
  }
  function td(v) { return '<td>' + escapeHtml(v == null ? '' : String(v)) + '</td>'; }
  function escapeHtml(s) { return s.replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  els.save.addEventListener('click', saveKey);
  els.clear.addEventListener('click', clearKey);
  els.refresh.addEventListener('click', fetchData);
  els.auto.addEventListener('change', function () { if (els.auto.checked && firstSuccess) { startAuto(); } else { stopAuto(); } });

  var existing = getStoredKey();
  if (existing) { els.key.value = existing; els.remember.checked = !!localStorage.getItem(KEY_NAME); fetchData(); }
  else { setStatus('请填写管理 key 后保存', ''); }
  setInterval(function () { if (rowsData.length) paint(); }, 1000); // Refresh countdown every second.
})();
</script>
</body>
</html>
