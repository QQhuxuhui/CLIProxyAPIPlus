  /* Structural CSS keeps table and health markup stable. */
  [hidden] { display: none !important; }
  #modal-backdrop[hidden] { display: none; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .muted { color: #94a3b8; }

  /* Shared white-SaaS data table look. Account-table headers stay plain <th>. */
  .data-table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
  .data-table th, .data-table td { padding: 10px 14px; text-align: left; white-space: nowrap; border-bottom: 1px solid #eef2f6; }
  .data-table thead th { background: #f8fafc; color: #64748b; font-weight: 600; font-size: 12px; letter-spacing: .01em; position: sticky; top: 0; z-index: 1; }
  .data-table tbody tr:hover { background: #f8fafc; }
  .data-table tbody tr:last-child td { border-bottom: 0; }

  /* Account-row inline controls */
  .acct-name { color: #4f46e5; background: none; border: none; padding: 0; font-size: 13px; font-weight: 500; text-decoration: none; cursor: pointer; }
  .acct-name:hover { text-decoration: underline; }
  .del-btn { color: #dc2626; background: none; border: none; padding: 0; font-size: 13px; cursor: pointer; }
  .del-btn:hover { text-decoration: underline; }
  .refresh-credits { display: inline-flex; align-items: center; margin-left: 6px; padding: 1px 8px; font-size: 11px; line-height: 1.6; color: #4f46e5; background: #eef2ff; border: 1px solid #e0e7ff; border-radius: 9999px; cursor: pointer; }
  .refresh-credits:hover { background: #e0e7ff; }
  .refresh-credits[disabled] { opacity: .5; cursor: default; }
  .account-filters { display: grid; grid-template-columns: minmax(180px, 1.5fr) minmax(130px, .8fr) minmax(145px, .9fr) minmax(145px, .9fr) minmax(130px, .8fr) minmax(130px, .8fr); gap: 10px; margin-bottom: 12px; }
  .account-filter label { display: block; margin-bottom: 4px; color: #64748b; font-size: 12px; font-weight: 500; }
  .account-filter input, .account-filter select, .account-page-size { width: 100%; height: 36px; padding: 0 10px; color: #334155; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
  .account-filter input:focus, .account-filter select:focus, .account-page-size:focus { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,.16); }
  .account-pagination { min-height: 52px; padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid #eef2f6; }
  .account-page-controls { display: flex; align-items: center; gap: 8px; }
  .account-page-size { width: 76px; }
  .account-page-button { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #cbd5e1; border-radius: 6px; color: #475569; background: #fff; }
  .account-page-button:hover:not(:disabled) { background: #f8fafc; color: #0f172a; }
  .account-page-button:disabled { opacity: .4; cursor: default; }
  .status-error { color: #dc2626; text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; }
  /* Raw upstream bodies can be long; the cell truncates and the hover tip carries the full text. */
  .error-detail { display: inline-block; max-width: 220px; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; color: #dc2626; font-variant-numeric: tabular-nums; cursor: help; }
  .request-count { font-variant-numeric: tabular-nums; cursor: help; }
  .auth-failures { display: inline-block; margin-left: 6px; padding: 0 6px; color: #991b1b; background: #fee2e2; border-radius: 999px; font-size: 11px; font-variant-numeric: tabular-nums; cursor: help; }

  /* Multi-select + batch delete */
  .data-table th.select-col, .data-table td.select-col { width: 36px; padding-right: 0; }
  .row-select, #account-select-all { width: 14px; height: 14px; accent-color: #4f46e5; cursor: pointer; vertical-align: middle; }
  .account-bulk-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 14px; margin-bottom: 12px; background: #eef2ff; border: 1px solid #e0e7ff; border-radius: 8px; }
  .account-bulk-actions { display: flex; align-items: center; gap: 8px; }
  .account-bulk-button { padding: 4px 12px; font-size: 12px; color: #475569; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; }
  .account-bulk-button:hover:not(:disabled) { background: #f8fafc; color: #0f172a; }
  .account-bulk-button.danger { color: #dc2626; border-color: #fecaca; }
  .account-bulk-button.danger:hover:not(:disabled) { background: #fef2f2; }
  .account-bulk-button:disabled { opacity: .5; cursor: default; }
  /* Fixed-position tooltip driven by delegated JS: native title tooltips get
     cancelled every time the 15s auto-refresh rebuilds the table rows. */
  #hover-tip { position: fixed; z-index: 60; max-width: 360px; padding: 6px 10px; font-size: 12px; line-height: 1.5; color: #fff; background: #1f2937; border-radius: 6px; box-shadow: 0 4px 12px rgba(15,23,42,.25); white-space: pre-wrap; word-break: break-all; pointer-events: none; }
  @media (max-width: 900px) { .account-filters { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) {
    .account-filters { grid-template-columns: minmax(0, 1fr); }
    .account-pagination { align-items: flex-start; flex-direction: column; }
    .account-page-controls { width: 100%; justify-content: space-between; }
  }

  /* Model-health table specifics (unchanged behavior) */
  .mh .glyph { font-weight: 700; }
  .mh .track { display: inline-flex; width: 120px; height: 12px; background: #eef2f6; border-radius: 6px; overflow: hidden; vertical-align: middle; }
  .mh .seg { height: 12px; }
  @media (max-width: 700px) { .mh th.wide, .mh td.wide { display: none; } }

  /* Usage-stats modal */
  #modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .range-bar button.active { color: #4f46e5; font-weight: 600; }

  /* Model call statistics */
  .stats-card { overflow: hidden; }
  .stats-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 18px 20px 10px; }
  .stats-legend { display: flex; align-items: center; gap: 14px; color: #475569; font-size: 12px; }
  .stats-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .stats-swatch { width: 9px; height: 9px; border-radius: 2px; }
  .stats-swatch-success { background: #16a34a; }
  .stats-swatch-fail { background: #dc2626; }
  .stats-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 0 20px 12px; }
  .stats-controls > button { min-height: 32px; padding: 5px 10px; border: 1px solid transparent; border-radius: 6px; color: #475569; font-size: 13px; }
  .stats-controls > button:hover { color: #4f46e5; background: #f8fafc; }
  .stats-controls > button.active { color: #4338ca; background: #eef2ff; border-color: #c7d2fe; font-weight: 600; }
  .stats-custom-range { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: 6px; }
  .stats-custom-range input { height: 32px; min-width: 0; padding: 0 8px; border: 1px solid #cbd5e1; border-radius: 6px; color: #334155; }
  .stats-custom-range button { height: 32px; padding: 0 12px; border-radius: 6px; color: #fff; background: #4f46e5; font-weight: 600; }
  .stats-status { min-height: 30px; padding: 4px 20px 8px; }
  .stats-rows { max-height: 560px; overflow-y: auto; border-top: 1px solid #eef2f6; }
  .stats-row { display: grid; grid-template-columns: minmax(140px, 220px) minmax(160px, 1fr) minmax(150px, auto); align-items: center; gap: 16px; min-height: 54px; padding: 10px 20px; border-bottom: 1px solid #eef2f6; }
  .stats-row:last-child { border-bottom: 0; }
  .stats-model { display: block; overflow: hidden; color: #334155; font-size: 13px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
  .stats-model:focus, .stats-bar:focus { outline: 2px solid rgba(99,102,241,.45); outline-offset: 2px; }
  .stats-track { width: 100%; height: 14px; overflow: hidden; background: #eef2f6; border-radius: 4px; }
  .stats-fill { display: flex; height: 100%; overflow: hidden; border-radius: 4px; }
  .stats-segment-success { height: 100%; background: #16a34a; }
  .stats-segment-fail { height: 100%; background: #dc2626; }
  .stats-counts { text-align: right; }
  .stats-total { display: block; color: #0f172a; font-size: 13px; font-weight: 600; }
  .stats-breakdown { display: block; margin-top: 2px; color: #64748b; font-size: 11px; white-space: nowrap; }
  @media (max-width: 640px) {
    .stats-header { align-items: flex-start; flex-direction: column; }
    .stats-controls { align-items: stretch; }
    .stats-custom-range { width: 100%; margin: 4px 0 0; }
    .stats-custom-range input { flex: 1 1 120px; }
    .stats-row { grid-template-columns: minmax(0, 1fr) auto; gap: 7px 12px; }
    .stats-bar { grid-column: 1 / -1; grid-row: 2; }
    .stats-counts { display: contents; }
    .stats-total { grid-column: 2; grid-row: 1; text-align: right; }
    .stats-breakdown { grid-column: 1 / -1; grid-row: 3; margin-top: 0; text-align: left; }
  }
</style>

<!-- ============ LOGIN VIEW ============ -->
<div id="login-view" class="min-h-[100dvh] flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="flex items-center gap-3 justify-center mb-6">

        <svg viewBox="0 0 24 24" fill="none" class="h-6 w-6 text-white"><path d="M12 3l7 4v5c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V7l7-4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>

      <h1 class="text-base font-semibold text-slate-900">请输入管理 key</h1>
      <p class="mt-1 text-sm text-slate-500">验证通过后进入账号统计页面。</p>

        <label for="key" class="block text-sm font-medium text-slate-700 mb-1.5">管理 key</label>
        <input id="key" type="password" autocomplete="off"
               placeholder="remote-management.secret-key 或 MANAGEMENT_PASSWORD"

      </label>
      <button id="save" class="mt-5 w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 active:translate-y-px transition">进入</button>
      <div id="status" class="mt-3 text-sm text-slate-500 min-h-[20px]"></div>
    </div>
    <p class="mt-4 text-center text-xs text-slate-400">CLIProxyAPI · 自研配额监控面板</p>
  </div>
</div>

<script>
(function () {
  var KEY_NAME = 'cpa_quota_monitor_key';
  var ENDPOINT = '/v0/management/auth-files';
  var REFRESH_MS = 15000;
  var els = {};
  ['key','remember','save','clear','refresh','auto','updated','status','table','rows','empty','account-name-filter','account-plan-filter','account-created-from','account-created-to','account-status-filter','account-error-filter','account-page-size','account-page-prev','account-page-next','account-page-info','account-pagination','account-select-all','account-bulk-bar','account-bulk-count','account-bulk-clear','account-bulk-delete'].forEach(function (id) { els[id] = document.getElementById(id); });
  var accountsData = []; // account rows currently rendered (raw auth-files entries)
  var accountPage = 1;
  var selectedAccounts = []; // account names ticked for batch delete, kept across refreshes
  var modelRows = [];    // by_model rows with derived tier/pct, sorted worst-first
  var firstSuccess = false;
  var autoTimer = null;
  var currentTab = 'accounts';
  var statsState = {
    range: { preset: '7d', from: '', to: '' },
    serverToday: '',
    lastRequestAt: 0,
    lastSuccessAt: 0,
    lastSuccessRange: null,
    loaded: false,
    generation: 0,
    controller: null
  };

  function getStoredKey() { return sessionStorage.getItem(KEY_NAME) || localStorage.getItem(KEY_NAME) || ''; }
  function setStatus(msg, kind) {
    var cls = kind === 'err' ? 'text-red-600' : (kind === 'ok' ? 'text-emerald-600' : 'text-slate-500');
    var login = document.getElementById('status');
    if (login) { login.textContent = msg || ''; login.className = 'mt-3 text-sm min-h-[20px] ' + cls; }
    var app = document.getElementById('app-status');
    if (app) { app.textContent = msg || ''; app.className = 'text-xs hidden sm:inline max-w-[280px] truncate ' + cls; }
  }
  function stopAuto() { els.auto.checked = false; if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  function startAuto() {
    if (autoTimer) return;
    autoTimer = setInterval(function () { fetchData('auto'); }, REFRESH_MS);
  }

  function showApp() {
    document.getElementById('login-view').hidden = true;
    document.getElementById('app-view').hidden = false;
    loadProxyOnce();
  }
  function showLogin() {
    document.getElementById('app-view').hidden = true;
    document.getElementById('login-view').hidden = false;
  }

  function clearRenderedData() {
    accountsData = []; modelRows = []; accountPage = 1; selectedAccounts = [];
    els['account-bulk-bar'].hidden = true;
    els['account-select-all'].checked = false;
    els['account-select-all'].indeterminate = false;
    els.rows.innerHTML = '';
    els.table.hidden = true;
    els.empty.hidden = true;
    els['account-pagination'].hidden = true;
    document.getElementById('dashboard').hidden = true;
    document.getElementById('mh-rows').innerHTML = '';
    document.getElementById('strip-models').innerHTML = '';
    document.getElementById('strip-soonest').textContent = '';
    resetModelStatsState();
    els.updated.textContent = '';
  }
  function readError(resp) {
    return resp.text().then(function (t) {
      if (!t) return '';
      try {
        var parsed = JSON.parse(t);
        if (parsed && parsed.error) return String(parsed.error);
        if (parsed && parsed.message) return String(parsed.message);
      } catch (e) {}
      return t;
    });
  }

  function usageRangeQuery(range) {
    range = range || {};
    if (range.preset && range.preset !== 'custom') return 'preset=' + encodeURIComponent(range.preset);
    return 'from=' + encodeURIComponent(range.from || '') + '&to=' + encodeURIComponent(range.to || '');
  }
  function setStatsActiveRange(id) {
    ['stats-range-today', 'stats-range-yesterday', 'stats-range-7d', 'stats-range-custom'].forEach(function (buttonID) {
      var active = buttonID === id;
      var button = document.getElementById(buttonID);
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
  }
  function staleStatsSuffix() {
    var range = statsState.lastSuccessRange;
    return range ? '；仍显示 ' + range.from + ' 至 ' + range.to + ' 的上次结果' : '';
  }

  function saveKey() {
    var k = els.key.value.trim();
    if (!k) { setStatus('请填写管理 key', 'err'); return; }
    sessionStorage.setItem(KEY_NAME, k);
    if (els.remember.checked) { localStorage.setItem(KEY_NAME, k); } else { localStorage.removeItem(KEY_NAME); }
    setStatus('验证中…', '');
    fetchData('login');
  }
  function clearKey() {
    sessionStorage.removeItem(KEY_NAME); localStorage.removeItem(KEY_NAME);
    els.key.value = ''; stopAuto(); firstSuccess = false; els.auto.disabled = true;
    clearRenderedData();
    showLogin();
    setStatus('key 已清除', '');
  }

  function fmtDur(ms) {
    if (ms <= 0) return '已恢复';
    var s = Math.floor(ms / 1000), d = Math.floor(s / 86400); s -= d * 86400;
    var h = Math.floor(s / 3600); s -= h * 3600; var m = Math.floor(s / 60); s -= m * 60;
    var out = ''; if (d) out += d + 'd '; if (d || h) out += h + 'h '; out += m + 'm ' + s + 's';
    return out;
  }

  function fetchData(reason) {
    var k = getStoredKey();
    if (!k) { setStatus('请填写管理 key 后进入', 'err'); return; }   // Never send requests without a key to avoid failed-attempt bans.
    fetch(ENDPOINT, { headers: { 'Authorization': 'Bearer ' + k } }).then(function (resp) {
      if (resp.status === 401) {
        stopAuto(); els.auto.disabled = true; firstSuccess = false;
        clearRenderedData(); showLogin();
        return readError(resp).then(function (msg) {
          setStatus('管理 key 无效或缺失，请重新填写' + (msg ? '：' + msg : ''), 'err');
          els.key.focus();
          return null;
        });
      }
      if (resp.status === 403) {
        stopAuto(); els.auto.disabled = true; firstSuccess = false;
        clearRenderedData(); showLogin();
        return readError(resp).then(function (msg) {
          var lower = msg.toLowerCase();
          if (lower.indexOf('banned') >= 0 || lower.indexOf('too many failed') >= 0) {
            setStatus('已被临时封禁（管理 API 失败次数过多），请稍后再试。' + (msg ? ' ' + msg : ''), 'err');
          } else if (lower.indexOf('remote management disabled') >= 0) {
            setStatus('远程管理未开启：请在服务端启用 remote-management.allow-remote 后重试', 'err');
          } else if (lower.indexOf('management key not set') >= 0) {
            setStatus('管理 API 未配置 key：请先配置 remote-management.secret-key（或 MANAGEMENT_PASSWORD）后重试', 'err');
          } else {
            setStatus('管理 API 拒绝访问' + (msg ? '：' + msg : ''), 'err');
          }
          return null;
        });
      }
      if (resp.status === 404) { stopAuto(); els.auto.disabled = true; firstSuccess = false; clearRenderedData(); showLogin(); setStatus('管理 API 未启用：请先配置 remote-management.secret-key（或 MANAGEMENT_PASSWORD）后重试', 'err'); return null; }
      if (!resp.ok) { setStatus('请求失败：HTTP ' + resp.status, 'err'); return null; }
      return resp.json();
    }).then(function (data) {
      if (!data) return;
      firstSuccess = true; els.auto.disabled = false;
      showApp();
      render(data.files || []);
      fetchSummary(k);
      if (currentTab === 'stats') {
        if (reason === 'manual' || reason === 'login') requestModelStats();
        else if (reason === 'auto') maybeAutoRefreshModelStats();
      }
      els.updated.textContent = '更新于 ' + new Date().toLocaleTimeString();
      setStatus('', '');
    }).catch(function (e) { setStatus('网络错误：' + e, 'err'); });
  }

  var COLORS = { available: '#16a34a', cooling: '#dc2626', disabled: '#94a3b8' };
  // Health tiers derived from round-robin load math: survivors absorb serving/available x
  // their normal share. <60% -> >1.67x (WARN); <20% -> >=5x, cascade imminent (CRIT);
  // a single surviving account in a multi-account pool is a SPOF (CRIT).
  var HEALTH = {
    pctCrit: 20, pctWarn: 60,
    tiers: {
      DOWN: { glyph: '○', color: '#dc2626', rank: 0 },
      CRIT: { glyph: '◔', color: '#dc2626', rank: 1 },
      WARN: { glyph: '◑', color: '#ea580c', rank: 2 },
      OK:   { glyph: '●', color: '#16a34a', rank: 3 },
      OFF:  { glyph: '◌', color: '#94a3b8', rank: 4 }
    }
  };
  function healthOf(m) {
    var serving = (m.total || 0) - (m.disabled || 0);
    if (serving <= 0) return 'OFF';
    if ((m.available || 0) === 0) return 'DOWN';
    var pct = Math.round(100 * m.available / serving);
    if (pct < HEALTH.pctCrit || (m.available === 1 && serving >= 2)) return 'CRIT';
    if (pct < HEALTH.pctWarn) return 'WARN';
    return 'OK';
  }

  function fetchSummary(k) {
    // Only called after the table fetch succeeded. Failures here must not
    // touch auto-refresh/ban handling (that lives in the main fetch); surface
    // a status message only — the next refresh cycle retries automatically.
    fetch('/v0/management/quota-summary', { headers: { 'Authorization': 'Bearer ' + k } })
      .then(function (resp) {
        if (!resp.ok) { setStatus('模型健康汇总加载失败：HTTP ' + resp.status + '（下次刷新自动重试）', 'err'); return null; }
        return resp.json();
      })
      .then(function (data) { if (data) renderSummary(data); })
      .catch(function (e) { setStatus('模型健康汇总加载失败：' + e + '（下次刷新自动重试）', 'err'); });
  }

  function renderSummary(d) {
    var p = d.pairs || {};
    modelRows = (d.by_model || []).map(function (m) {
      var serving = (m.total || 0) - (m.disabled || 0);
      var tier = healthOf(m);
      return {
        provider: m.provider || '', model: m.model || '',
        total: m.total || 0, available: m.available || 0, cooling: m.cooling || 0, disabled: m.disabled || 0,
        serving: serving, pct: serving > 0 ? Math.round(100 * (m.available || 0) / serving) : null,
        next: m.next_recover_at || '', last: m.last_recover_at || '', unknown: m.unknown_recovery || 0,
        tier: tier, rank: HEALTH.tiers[tier].rank
      };
    });
    modelRows.sort(mhCompare);
    // strip line 1
    var counts = { DOWN: 0, CRIT: 0, WARN: 0, OK: 0, OFF: 0 };
    modelRows.forEach(function (m) { counts[m.tier]++; });
    var unhealthy = counts.DOWN + counts.CRIT + counts.WARN;
    var resTxt = '资源 <b class="font-semibold text-slate-900">' + (p.available || 0) + '/' + (p.total || 0) + '</b> 可用 · 冷却 ' + (p.cooling || 0) + ' · 禁用 ' + (p.disabled || 0);
    if (unhealthy === 0) {
      var okCount = modelRows.length - counts.OFF;
      document.getElementById('strip-models').innerHTML = (counts.OFF > 0
        ? '可服务模型全部健康(' + okCount + ') · <span style="color:' + HEALTH.tiers.OFF.color + '">' + counts.OFF + ' ◌OFF</span>'
        : '全部 ' + modelRows.length + ' 个模型健康') + ' · ' + resTxt;
    } else {
      document.getElementById('strip-models').innerHTML = '模型: ' +
        ['DOWN', 'CRIT', 'WARN', 'OK'].map(function (tname) {
          var tt = HEALTH.tiers[tname];
          return '<span style="color:' + tt.color + '">' + counts[tname] + ' ' + tt.glyph + tname + '</span>';
        }).join(' · ') + (counts.OFF ? ' · ' + counts.OFF + ' ◌OFF' : '') + ' │ ' + resTxt;
    }
    paintModels();
    document.getElementById('dashboard').hidden = false;
  }

  function mhCompare(a, b) {
    if (a.rank !== b.rank) return a.rank - b.rank;
    var an = a.next ? new Date(a.next).getTime() : Infinity;
    var bn = b.next ? new Date(b.next).getTime() : Infinity;
    if (a.tier === 'DOWN') { if (an !== bn) return an - bn; }
    else if (a.tier === 'CRIT' || a.tier === 'WARN' || a.tier === 'OK') {
      if (a.pct !== b.pct) return (a.pct == null ? 101 : a.pct) - (b.pct == null ? 101 : b.pct);
      if (an !== bn) return an - bn;
    }
    if (a.provider !== b.provider) return a.provider < b.provider ? -1 : 1;
    return a.model < b.model ? -1 : (a.model > b.model ? 1 : 0);
  }

  function paintModels() {
    var now = Date.now();
    // strip line 2: soonest recovery among non-OK models with a known time
    var soon = null;
    modelRows.forEach(function (m) {
      if ((m.tier === 'DOWN' || m.tier === 'CRIT' || m.tier === 'WARN') && m.next) {

          return;
        }
        var data = result.data || {};
        statsState.serverToday = data.server_today || '';
        statsState.lastSuccessAt = Date.now();
        statsState.lastSuccessRange = { from: data.from || '', to: data.to || '' };
        var rowCount = renderModelStats(data);
        setStatsStatus(rowCount ? '' : '该时间段无调用记录', '');
      })
      .catch(function (error) {
        if (!ModelStatsLogic.isCurrentGeneration(generation, statsState.generation)) return;
        if (error && error.name === 'AbortError') return;
        statsState.controller = null;
        setStatsStatus('加载失败：网络错误 ' + error + staleStatsSuffix(), 'err');
      });
  }
  function maybeAutoRefreshModelStats() {
    if (ModelStatsLogic.shouldAutoRefresh({
      autoEnabled: els.auto.checked,
      tabActive: currentTab === 'stats',
      range: statsState.range,
      serverToday: statsState.serverToday,
      lastRequestAt: statsState.lastRequestAt,
      nowMs: Date.now()
    })) requestModelStats();
  }

  function refreshCredits(authIndex, silent) {
    var k = getStoredKey();
    if (!k || !authIndex) return;
    var btn = els.rows.querySelector('.refresh-credits[data-index="' + (window.CSS && CSS.escape ? CSS.escape(authIndex) : authIndex) + '"]');
    if (btn) { btn.disabled = true; btn.textContent = '刷新中…'; }
    fetch('/v0/management/antigravity-credits/refresh', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + k, 'Content-Type': 'application/json' },
      body: JSON.stringify({ auth_index: authIndex })
    }).then(function (resp) {
      if (!resp.ok) { return readError(resp).then(function (msg) { return { ok: false, msg: msg }; }); }
      return resp.json().then(function (d) { return { ok: true, data: d }; });
    }).then(function (result) {
      if (!result) return;
      if (!result.ok) { if (!silent) setStatus('刷新额度失败：' + (result.msg || '请求失败'), 'err'); if (btn) { btn.disabled = false; btn.textContent = '刷新额度'; } return; }
      var tier = result.data && result.data.paid_tier;
      accountsData.forEach(function (a) { if ((a.auth_index || '') === authIndex && tier) { a.paid_tier = tier; } });
      renderAccountView({ resetPage: false, rebuildOptions: true, preserveMissingPlan: true });
      if (!silent) setStatus('额度已刷新', 'ok');
    }).catch(function (e) {
      if (!silent) setStatus('刷新额度失败：网络错误 ' + e, 'err');
      if (btn) { btn.disabled = false; btn.textContent = '刷新额度'; }
    });
  }

  function deleteAccount(name) {
    var k = getStoredKey();
    fetch(ENDPOINT + '?name=' + encodeURIComponent(name), { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + k } })
      .then(function (resp) {
        if (resp.ok) return { ok: true };
        return readError(resp).then(function (msg) { return { ok: false, msg: msg }; });
      })
      .then(function (result) {
        if (!result.ok) { setStatus('删除失败：' + (result.msg || '请求失败'), 'err'); return; }
        accountsData = accountsData.filter(function (a) { return a.name !== name; });
        renderAccountView({ resetPage: false, rebuildOptions: true });
        setStatus('已删除 "' + name + '"', 'ok');
      })
      .catch(function (e) { setStatus('删除失败：网络错误 ' + e, 'err'); });
  }

  // Batch delete posts every name in one request: the management API accepts a
  // names array and answers 207 with a per-name failure list when only some go.
  function deleteSelectedAccounts(names) {
    var k = getStoredKey();
    var button = els['account-bulk-delete'];
    button.disabled = true;
    setStatus('正在删除 ' + names.length + ' 个账号…', '');
    fetch(ENDPOINT, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + k, 'Content-Type': 'application/json' },
      body: JSON.stringify({ names: names })
    })
      .then(function (resp) {
        if (!resp.ok) return readError(resp).then(function (msg) { return { ok: false, msg: msg }; });
        return resp.json().then(function (data) { return { ok: true, data: data }; })
          .catch(function () { return { ok: true, data: null }; });
      })
      .then(function (result) {
        if (!result.ok) {
          button.disabled = false;
          setStatus('批量删除失败：' + (result.msg || '请求失败'), 'err');
          return;
        }
        var failures = (result.data && result.data.failed) || [];
        var failedNames = {};
        failures.forEach(function (item) {
          if (item && item.name) failedNames[item.name] = String(item.error || '删除失败');
        });
        var removed = names.filter(function (name) { return !failedNames[name]; });
        accountsData = accountsData.filter(function (a) { return removed.indexOf(a.name) < 0; });
        // Keep the failed ones ticked so a retry does not need re-selecting.
        selectedAccounts = names.filter(function (name) { return !!failedNames[name]; });
        renderAccountView({ resetPage: false, rebuildOptions: true });
        if (failures.length > 0) {
          var detail = failures.slice(0, 3).map(function (item) { return item.name + '（' + failedNames[item.name] + '）'; }).join('、');
          setStatus('已删除 ' + removed.length + ' 个，' + failures.length + ' 个失败：' + detail +
            (failures.length > 3 ? ' 等' : ''), 'err');
          return;
        }
        setStatus('已删除 ' + removed.length + ' 个账号', 'ok');
      })
      .catch(function (e) {
        button.disabled = false;
        setStatus('批量删除失败：网络错误 ' + e, 'err');
      });
  }

  // ---- Tabs ----
  function tabBtnClass(active) {
    return 'px-1 py-3 text-sm font-medium border-b-2 -mb-px transition ' +
      (active ? 'text-indigo-600 border-indigo-600' : 'text-slate-500 border-transparent hover:text-slate-800');
  }
  function switchTab(name) {
    currentTab = name;
    ['accounts', 'stats', 'health', 'proxy'].forEach(function (tabName) {
      var panel = document.getElementById('tab-' + tabName);
      var button = document.getElementById('tabbtn-' + tabName);
      if (panel) panel.hidden = tabName !== name;
      if (button) button.className = tabBtnClass(tabName === name);
    });
    if (name === 'proxy') loadProxyOnce();
    if (name === 'stats' && (!statsState.loaded || ModelStatsLogic.shouldRefreshOnActivate(statsState.lastSuccessAt, Date.now()))) requestModelStats();
  }

  // ---- Proxy settings ----
  var proxyLoaded = false;
  function setProxyResult(msg, kind) {
    var el = document.getElementById('proxy-result');
    if (!el) return;
    var cls = kind === 'err' ? 'text-red-600' : (kind === 'ok' ? 'text-emerald-600' : 'text-slate-500');
    el.textContent = msg || '';
    el.className = 'mt-4 text-sm min-h-[20px] ' + cls;
  }
  function loadProxyOnce() { if (proxyLoaded) return; proxyLoaded = true; loadProxy(); }
  function loadProxy() {
    var k = getStoredKey();
    if (!k) return;
    fetch('/v0/management/proxy-url', { headers: { 'Authorization': 'Bearer ' + k } })
      .then(function (resp) { return resp.ok ? resp.json() : null; })
      .then(function (d) { if (d) { var el = document.getElementById('proxy-url'); if (el) el.value = d['proxy-url'] || ''; } })
      .catch(function () { /* best-effort: proxy prefill is optional */ });
  }
  function saveProxy() {
    var k = getStoredKey();
    if (!k) { setProxyResult('请先登录', 'err'); return; }
    var v = document.getElementById('proxy-url').value.trim();
    setProxyResult('保存中…', '');
    fetch('/v0/management/proxy-url', {
      method: 'PUT',
      headers: { 'Authorization': 'Bearer ' + k, 'Content-Type': 'application/json' },
      body: JSON.stringify({ value: v })
    }).then(function (resp) {
      if (resp.ok) { setProxyResult('已保存并热加载生效' + (v ? '' : '（已切换为直连）'), 'ok'); return; }
      return readError(resp).then(function (m) { setProxyResult('保存失败：' + (m || ('HTTP ' + resp.status)), 'err'); });
    }).catch(function (e) { setProxyResult('保存失败：网络错误 ' + e, 'err'); });
  }
  function testProxy() {
    var k = getStoredKey();
    if (!k) { setProxyResult('请先登录', 'err'); return; }
    var v = document.getElementById('proxy-url').value.trim();
    setProxyResult('测试中…（经' + (v ? '代理' : '直连') + '访问 Google）', '');
    fetch('/v0/management/proxy-test', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + k, 'Content-Type': 'application/json' },
      body: JSON.stringify({ 'proxy-url': v })
    }).then(function (resp) {
      if (!resp.ok) { return readError(resp).then(function (m) { setProxyResult('测试失败：' + (m || ('HTTP ' + resp.status)), 'err'); return null; }); }
      return resp.json();
    }).then(function (d) {
      if (!d) return;
      if (d.ok) { setProxyResult('连通正常 · HTTP ' + d.http_status + ' · ' + d.latency_ms + 'ms' + (v ? '（经代理）' : '（直连）'), 'ok'); }
      else { setProxyResult('连通失败：' + (d.error || ('HTTP ' + d.http_status)) + ' · ' + d.latency_ms + 'ms', 'err'); }
    }).catch(function (e) { setProxyResult('测试失败：网络错误 ' + e, 'err'); });
  }

  // ---- Usage-stats modal ----
  var modalAccountIndex = null;
  var modalGeneration = 0;
  var modalController = null;

  function cancelModalRequest() {
    modalGeneration = ModelStatsLogic.nextGeneration(modalGeneration);
    if (modalController) modalController.abort();
    modalController = null;
  }

  function setModalStatus(msg, kind) {
    var el = document.getElementById('modal-status');
    el.textContent = msg || '';
    el.className = 'mt-3 text-sm min-h-[20px] ' + (kind === 'err' ? 'text-red-600' : 'text-slate-500');
  }
  function setActiveRangeButton(id) {
    ['range-today', 'range-yesterday', 'range-7d', 'range-custom'].forEach(function (bid) {
      document.getElementById(bid).classList.toggle('active', bid === id);
    });
  }
  function openUsageModal(name, authIndex) {
    modalAccountIndex = authIndex;
    document.getElementById('modal-title').textContent = '调用统计 · ' + name + '（' + authIndex + '）';
    document.getElementById('custom-range').hidden = true;
    document.getElementById('modal-table').hidden = true;
    document.getElementById('modal-rows').innerHTML = '';
    document.getElementById('modal-backdrop').hidden = false;
    setActiveRangeButton('range-today');
    fetchUsage({ preset: 'today', from: '', to: '' });
  }
  function closeModal() {
    cancelModalRequest();
    document.getElementById('modal-backdrop').hidden = true;
    modalAccountIndex = null;
  }
  function fetchUsage(range) {
    var key = getStoredKey();
    var accountIndex = modalAccountIndex;
    cancelModalRequest();
    var generation = modalGeneration;
    var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    modalController = controller;
    setModalStatus('加载中…', '');
    document.getElementById('modal-table').hidden = true;
    var options = { headers: { 'Authorization': 'Bearer ' + key } };
    if (controller) options.signal = controller.signal;
    fetch('/v0/management/usage-stats?account=' + encodeURIComponent(accountIndex) + '&' + usageRangeQuery(range), options)
      .then(function (response) {
        if (response.status === 503) return { kind: 'disabled' };
        if (!response.ok) {
          return readError(response).then(function (message) {
            return { kind: 'error', status: response.status, message: message || ('HTTP ' + response.status) };
          });
        }
        return response.json().then(function (data) { return { kind: 'ok', data: data }; });
      })
      .then(function (result) {
        if (!ModelStatsLogic.isCurrentGeneration(generation, modalGeneration)) return;
        modalController = null;
        if (result.kind === 'disabled') {
          setModalStatus('未开启用量统计，请在 config.yaml 设置 usage-stats-enabled: true 后重启/重载', 'err');
          return;
        }
        if (result.kind === 'error') {
          setModalStatus('加载失败：' + result.message, 'err');
          return;
        }
        var data = result.data || {};
        var account = (data.accounts || [])[0];
        var models = account ? account.models : [];
        if (!models || !models.length) {
          setModalStatus('该时间范围内无调用记录', '');
          return;
        }
        setModalStatus('', '');
        document.getElementById('modal-rows').innerHTML = models.map(function (model) {
          return '<tr>' + td(model.model) + td(model.success) + td(model.fail) + td(model.total) + '</tr>';
        }).join('');
        document.getElementById('modal-table').hidden = false;
      })
      .catch(function (error) {
        if (!ModelStatsLogic.isCurrentGeneration(generation, modalGeneration)) return;
        if (error && error.name === 'AbortError') return;
        modalController = null;
        setModalStatus('加载失败：网络错误 ' + error, 'err');
      });
  }

  // ---- Wiring ----
  els.save.addEventListener('click', saveKey);
  els.key.addEventListener('keydown', function (e) { if (e.key === 'Enter') saveKey(); });
  els.clear.addEventListener('click', clearKey);
  els.refresh.addEventListener('click', function () { fetchData('manual'); });
  els.auto.addEventListener('change', function () { if (els.auto.checked && firstSuccess) { startAuto(); } else { stopAuto(); } });
  ['account-name-filter', 'account-created-from', 'account-created-to'].forEach(function (id) {
    els[id].addEventListener(id === 'account-name-filter' ? 'input' : 'change', function () {
      renderAccountView({ resetPage: true, rebuildOptions: false });
    });
  });
  ['account-plan-filter', 'account-status-filter', 'account-error-filter'].forEach(function (id) {
    els[id].addEventListener('change', function () { renderAccountView({ resetPage: true, rebuildOptions: false }); });
  });
  els['account-page-size'].addEventListener('change', function () { renderAccountView({ resetPage: true, rebuildOptions: false }); });
  els['account-page-prev'].addEventListener('click', function () { accountPage--; renderAccountView({ resetPage: false, rebuildOptions: false }); });
  els['account-page-next'].addEventListener('click', function () { accountPage++; renderAccountView({ resetPage: false, rebuildOptions: false }); });
  ['accounts', 'stats', 'health', 'proxy'].forEach(function (n) {
    var b = document.getElementById('tabbtn-' + n);
    if (b) b.addEventListener('click', function () { switchTab(n); });
  });
  document.getElementById('proxy-save').addEventListener('click', saveProxy);
  document.getElementById('proxy-test').addEventListener('click', testProxy);
  // Row checkboxes: 'change' bubbles, so one listener survives the row rebuild.
  els.rows.addEventListener('change', function (e) {
    var box = e.target && e.target.closest ? e.target.closest('.row-select') : null;
    if (!box) return;
    var name = box.getAttribute('data-name') || '';
    var index = selectedAccounts.indexOf(name);
    if (box.checked && index < 0) selectedAccounts.push(name);
    if (!box.checked && index >= 0) selectedAccounts.splice(index, 1);
    paintSelectionControls(AccountViewLogic.filterAccounts(accountsData, currentAccountFilters()));
  });
  // Header checkbox spans every filtered row, not just the visible page, so a
  // filter-then-select-all-then-delete pass does not need paging through.
  els['account-select-all'].addEventListener('change', function () {
    var filtered = AccountViewLogic.filterAccounts(accountsData, currentAccountFilters());
    selectedAccounts = AccountViewLogic.toggleSelection(selectedAccounts, filtered, els['account-select-all'].checked);
    renderAccountView({ resetPage: false, rebuildOptions: false });
  });
  els['account-bulk-clear'].addEventListener('click', function () {
    selectedAccounts = [];
    renderAccountView({ resetPage: false, rebuildOptions: false });
  });
  els['account-bulk-delete'].addEventListener('click', function () {
    var names = selectedAccounts.slice();
    if (!names.length) return;
    var preview = names.slice(0, 10).join('\n') + (names.length > 10 ? '\n… 等 ' + names.length + ' 个' : '');
    if (window.confirm('确定删除选中的 ' + names.length + ' 个认证文件吗？此操作不可恢复。\n\n' + preview)) {
      deleteSelectedAccounts(names);
    }
  });
  els.rows.addEventListener('click', function (e) {
    var delBtn = e.target && e.target.closest ? e.target.closest('.del-btn') : null;
    if (delBtn) {
      var name = delBtn.getAttribute('data-name');
      if (window.confirm('确定删除认证文件 "' + name + '" 吗？此操作不可恢复。')) { deleteAccount(name); }
      return;
    }
    var creditBtn = e.target && e.target.closest ? e.target.closest('.refresh-credits') : null;
    if (creditBtn) { refreshCredits(creditBtn.getAttribute('data-index'), false); return; }
    var nameBtn = e.target && e.target.closest ? e.target.closest('.acct-name') : null;
    if (nameBtn) { openUsageModal(nameBtn.getAttribute('data-name'), nameBtn.getAttribute('data-index')); }
  });
  // Delegated hover tooltip: listener lives on document so it survives the
  // periodic innerHTML rebuild that destroys the hovered row nodes.
  var hoverTip = document.getElementById('hover-tip');
  function showHoverTip(target) {
    var element = target && target.closest ? target.closest('[data-tip]') : null;
    var message = element ? String(element.getAttribute('data-tip') || '') : '';
    if (!message) { hoverTip.hidden = true; return; }
    hoverTip.textContent = message;
    hoverTip.style.left = '0px';
    hoverTip.style.top = '0px';
    hoverTip.hidden = false;
    var rect = element.getBoundingClientRect();
    var left = Math.max(8, Math.min(rect.left, window.innerWidth - hoverTip.offsetWidth - 8));
    var top = rect.bottom + 6;
    if (top + hoverTip.offsetHeight > window.innerHeight - 8) top = rect.top - hoverTip.offsetHeight - 6;
    hoverTip.style.left = left + 'px';
    hoverTip.style.top = top + 'px';
  }
  document.addEventListener('mouseover', function (event) { showHoverTip(event.target); });
  document.addEventListener('focusin', function (event) { showHoverTip(event.target); });
  document.addEventListener('mouseout', function (event) {
    if (!event.relatedTarget || !event.relatedTarget.closest || !event.relatedTarget.closest('[data-tip]')) hoverTip.hidden = true;
  });
  document.addEventListener('focusout', function () { hoverTip.hidden = true; });
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-backdrop').addEventListener('click', function (e) { if (e.target && e.target.id === 'modal-backdrop') closeModal(); });
  [['stats-range-today', 'today'], ['stats-range-yesterday', 'yesterday'], ['stats-range-7d', '7d']].forEach(function (entry) {
    document.getElementById(entry[0]).addEventListener('click', function () {
      statsState.range = { preset: entry[1], from: '', to: '' };
      document.getElementById('stats-custom-range').hidden = true;
      setStatsActiveRange(entry[0]);
      requestModelStats();
    });
  });
  document.getElementById('stats-range-custom').addEventListener('click', function () {
    setStatsActiveRange('stats-range-custom');
    document.getElementById('stats-custom-range').hidden = false;
  });
  document.getElementById('stats-range-apply').addEventListener('click', function () {
    var from = document.getElementById('stats-range-from').value;
    var to = document.getElementById('stats-range-to').value;
    if (!from || !to) { setStatsStatus('请选择完整的起止日期', 'err'); return; }
    if (from > to) { setStatsStatus('结束日期不能早于开始日期', 'err'); return; }
    statsState.range = { preset: 'custom', from: from, to: to };
    requestModelStats();
  });
  document.getElementById('range-today').addEventListener('click', function () { setActiveRangeButton('range-today'); document.getElementById('custom-range').hidden = true; fetchUsage({ preset: 'today', from: '', to: '' }); });
  document.getElementById('range-yesterday').addEventListener('click', function () { setActiveRangeButton('range-yesterday'); document.getElementById('custom-range').hidden = true; fetchUsage({ preset: 'yesterday', from: '', to: '' }); });
  document.getElementById('range-7d').addEventListener('click', function () { setActiveRangeButton('range-7d'); document.getElementById('custom-range').hidden = true; fetchUsage({ preset: '7d', from: '', to: '' }); });
  document.getElementById('range-custom').addEventListener('click', function () { setActiveRangeButton('range-custom'); document.getElementById('custom-range').hidden = false; });
  document.getElementById('range-apply').addEventListener('click', function () {
    var from = document.getElementById('range-from').value;
    var to = document.getElementById('range-to').value;
    if (!from || !to) { setModalStatus('请选择完整的起止日期', 'err'); return; }
    if (from > to) { setModalStatus('结束日期不能早于开始日期', 'err'); return; }
    fetchUsage({ preset: 'custom', from: from, to: to });
  });

  var existing = getStoredKey();
  if (existing) { els.key.value = existing; els.remember.checked = !!localStorage.getItem(KEY_NAME); fetchData('login'); }
  else { setStatus('请填写管理 key 后进入', ''); }
  setInterval(function () {          // Refresh cooldown countdowns every second.
    if (modelRows.length) paintModels();
  }, 1000);
})();
</script>
</body>
</html>
