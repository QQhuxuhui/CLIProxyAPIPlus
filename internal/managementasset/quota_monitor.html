<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配额监控 · CLIProxyAPI</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .bar input[type=password] { flex: 1 1 320px; min-width: 220px; padding: 6px 8px; }
  button { padding: 6px 10px; cursor: pointer; }
  label { font-size: 13px; }
  #status { margin: 6px 0 12px; font-size: 13px; min-height: 18px; }
  #status.err { color: #c0392b; }
  #status.ok { color: #2e7d32; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; white-space: nowrap; }
  th { background: rgba(127,127,127,.15); position: sticky; top: 0; }
  .badge { padding: 1px 6px; border-radius: 4px; font-size: 12px; }
  .badge.q { background: #c0392b; color: #fff; }
  .badge.p { background: #e67e22; color: #fff; }
  .muted { color: #888; }
  #empty { padding: 24px; text-align: center; color: #888; }
  #dashboard { margin: 8px 0 18px; }
  .strip { font-size: 13px; line-height: 1.8; margin-bottom: 8px; }
  .strip b { font-weight: 700; }
  .sec { font-size: 13px; color: #888; margin: 16px 0 6px; }
  .mh tbody tr { cursor: pointer; }
  .mh tbody tr:hover { background: rgba(127,127,127,.08); }
  .mh .glyph { font-weight: 700; }
  .mh .track { display: inline-flex; width: 120px; height: 12px; background: rgba(127,127,127,.15); border-radius: 4px; overflow: hidden; vertical-align: middle; }
  .mh .seg { height: 12px; }
  #mh-filter { margin: 8px 0; font-size: 13px; }
  #mh-filter button { padding: 0 6px; margin-left: 4px; }
  @media (max-width: 700px) { .mh th.wide, .mh td.wide { display: none; } }
</style>
</head>
<body>
<h1>模型配额监控</h1>
<div class="bar">
  <input id="key" type="password" placeholder="管理 key（remote-management.secret-key 或 MANAGEMENT_PASSWORD）" autocomplete="off">
  <label><input id="remember" type="checkbox"> 记住 key</label>
  <button id="save">保存</button>
  <button id="clear">清除 key</button>
  <button id="refresh">刷新</button>
  <label><input id="auto" type="checkbox" disabled> 自动刷新(15s)</label>
  <span id="updated" class="muted"></span>
</div>
<div id="status"></div>
<section id="dashboard" hidden>
  <div id="dash-strip" class="strip">
    <div id="strip-models"></div>
    <div id="strip-soonest" class="muted"></div>
  </div>
  <table id="model-health" class="mh">
    <thead><tr>
      <th>状态</th><th>模型</th><th>provider</th><th>容量</th>
      <th>可用/服务</th><th>可用%</th><th>冷却</th><th>最快恢复</th><th class="wide">全部恢复</th>
    </tr></thead>
    <tbody id="mh-rows"></tbody>
  </table>
</section>
<div id="mh-filter" hidden>过滤: <b id="mh-filter-label"></b><button id="mh-filter-clear">✕</button></div>
<h2 class="sec">冷却明细（账号×模型）</h2>
<table id="table" hidden>
  <thead><tr>
    <th>provider</th><th>账号</th><th>model</th><th>quota</th><th>unavailable</th>
    <th>status</th><th>reason_code</th><th>upstream_model</th>
    <th>reset 倒计时</th><th>reset_at</th><th>next_retry_after</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
<div id="empty" hidden>当前无模型处于配额/冷却</div>
<script>
(function () {
  var KEY_NAME = 'cpa_quota_monitor_key';
  var ENDPOINT = '/v0/management/model-quota';
  var REFRESH_MS = 15000;
  var els = {};
  ['key','remember','save','clear','refresh','auto','updated','status','table','rows','empty'].forEach(function (id) { els[id] = document.getElementById(id); });
  var allRows = [];      // full detail rows (unfiltered)
  var rowsData = [];     // detail rows currently shown
  var modelRows = [];    // by_model rows with derived tier/pct, sorted worst-first
  var detailFilter = null; // {provider, model} | null
  var firstSuccess = false;
  var autoTimer = null;

  function getStoredKey() { return sessionStorage.getItem(KEY_NAME) || localStorage.getItem(KEY_NAME) || ''; }
  function setStatus(msg, kind) { els.status.textContent = msg || ''; els.status.className = kind || ''; }
  function stopAuto() { els.auto.checked = false; if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  function startAuto() { if (autoTimer) return; autoTimer = setInterval(fetchData, REFRESH_MS); }
  function clearRenderedData() {
    allRows = []; rowsData = []; modelRows = []; detailFilter = null;
    els.rows.innerHTML = '';
    els.table.hidden = true;
    els.empty.hidden = true;
    document.getElementById('dashboard').hidden = true;
    document.getElementById('mh-rows').innerHTML = '';
    document.getElementById('strip-models').innerHTML = '';
    document.getElementById('strip-soonest').textContent = '';
    document.getElementById('mh-filter').hidden = true;
    els.updated.textContent = '';
  }
  function readError(resp) {
    return resp.text().then(function (t) {
      if (!t) return '';
      try {
        var parsed = JSON.parse(t);
        if (parsed && parsed.error) return String(parsed.error);
        if (parsed && parsed.message) return String(parsed.message);
      } catch (e) {}
      return t;
    });
  }

  function saveKey() {
    var k = els.key.value.trim();
    if (!k) { setStatus('请填写管理 key', 'err'); return; }
    sessionStorage.setItem(KEY_NAME, k);
    if (els.remember.checked) { localStorage.setItem(KEY_NAME, k); } else { localStorage.removeItem(KEY_NAME); }
    setStatus('已保存', 'ok');
    fetchData();
  }
  function clearKey() {
    sessionStorage.removeItem(KEY_NAME); localStorage.removeItem(KEY_NAME);
    els.key.value = ''; stopAuto(); firstSuccess = false; els.auto.disabled = true;
    clearRenderedData();
    setStatus('key 已清除', '');
  }

  function fmtDur(ms) {
    if (ms <= 0) return '已恢复';
    var s = Math.floor(ms / 1000), d = Math.floor(s / 86400); s -= d * 86400;
    var h = Math.floor(s / 3600); s -= h * 3600; var m = Math.floor(s / 60); s -= m * 60;
    var out = ''; if (d) out += d + 'd '; if (d || h) out += h + 'h '; out += m + 'm ' + s + 's';
    return out;
  }

  function fetchData() {
    var k = getStoredKey();
    if (!k) { setStatus('请填写管理 key 后保存', 'err'); return; }   // Never send requests without a key to avoid failed-attempt bans.
    fetch(ENDPOINT, { headers: { 'Authorization': 'Bearer ' + k } }).then(function (resp) {
      if (resp.status === 401) {
        stopAuto(); els.auto.disabled = true; firstSuccess = false;
        clearRenderedData();
        return readError(resp).then(function (msg) {
          setStatus('管理 key 无效或缺失，请重新填写' + (msg ? '：' + msg : ''), 'err');
          els.key.focus();
          return null;
        });
      }
      if (resp.status === 403) {
        stopAuto(); els.auto.disabled = true; firstSuccess = false;
        clearRenderedData();
        return readError(resp).then(function (msg) {
          var lower = msg.toLowerCase();
          if (lower.indexOf('banned') >= 0 || lower.indexOf('too many failed') >= 0) {
            setStatus('已被临时封禁（管理 API 失败次数过多），请稍后再试。' + (msg ? ' ' + msg : ''), 'err');
          } else if (lower.indexOf('remote management disabled') >= 0) {
            setStatus('远程管理未开启：请在服务端启用 remote-management.allow-remote 后重试', 'err');
          } else if (lower.indexOf('management key not set') >= 0) {
            setStatus('管理 API 未配置 key：请先配置 remote-management.secret-key（或 MANAGEMENT_PASSWORD）后重试', 'err');
          } else {
            setStatus('管理 API 拒绝访问' + (msg ? '：' + msg : ''), 'err');
          }
          return null;
        });
      }
      if (resp.status === 404) { stopAuto(); els.auto.disabled = true; firstSuccess = false; clearRenderedData(); setStatus('管理 API 未启用：请先配置 remote-management.secret-key（或 MANAGEMENT_PASSWORD）后重试', 'err'); return null; }
      if (!resp.ok) { setStatus('请求失败：HTTP ' + resp.status, 'err'); return null; }
      return resp.json();
    }).then(function (data) {
      if (!data) return;
      firstSuccess = true; els.auto.disabled = false;
      render(data.accounts || []);
      fetchSummary(k);
      els.updated.textContent = '更新于 ' + new Date().toLocaleTimeString();
      setStatus('', '');
    }).catch(function (e) { setStatus('网络错误：' + e, 'err'); });
  }

  var COLORS = { available: '#2e7d32', cooling: '#c0392b', disabled: '#888' };
  // Health tiers derived from round-robin load math: survivors absorb serving/available x
  // their normal share. <60% -> >1.67x (WARN); <20% -> >=5x, cascade imminent (CRIT);
  // a single surviving account in a multi-account pool is a SPOF (CRIT).
  var HEALTH = {
    pctCrit: 20, pctWarn: 60,
    tiers: {
      DOWN: { glyph: '○', color: '#c0392b', rank: 0 },
      CRIT: { glyph: '◔', color: '#c0392b', rank: 1 },
      WARN: { glyph: '◑', color: '#e67e22', rank: 2 },
      OK:   { glyph: '●', color: '#2e7d32', rank: 3 },
      OFF:  { glyph: '◌', color: '#888',    rank: 4 }
    }
  };
  function healthOf(m) {
    var serving = (m.total || 0) - (m.disabled || 0);
    if (serving <= 0) return 'OFF';
    if ((m.available || 0) === 0) return 'DOWN';
    var pct = Math.round(100 * m.available / serving);
    if (pct < HEALTH.pctCrit || (m.available === 1 && serving >= 2)) return 'CRIT';
    if (pct < HEALTH.pctWarn) return 'WARN';
    return 'OK';
  }

  function fetchSummary(k) {
    // Only called after the table fetch succeeded. Failures here must not
    // touch auto-refresh/ban handling (that lives in the main fetch); surface
    // a status message only — the next refresh cycle retries automatically.
    fetch('/v0/management/quota-summary', { headers: { 'Authorization': 'Bearer ' + k } })
      .then(function (resp) {
        if (!resp.ok) { setStatus('模型健康汇总加载失败：HTTP ' + resp.status + '（下次刷新自动重试）', 'err'); return null; }
        return resp.json();
      })
      .then(function (data) { if (data) renderSummary(data); })
      .catch(function (e) { setStatus('模型健康汇总加载失败：' + e + '（下次刷新自动重试）', 'err'); });
  }

  function renderSummary(d) {
    var p = d.pairs || {};
    modelRows = (d.by_model || []).map(function (m) {
      var serving = (m.total || 0) - (m.disabled || 0);
      var tier = healthOf(m);
      return {
        provider: m.provider || '', model: m.model || '',
        total: m.total || 0, available: m.available || 0, cooling: m.cooling || 0, disabled: m.disabled || 0,
        serving: serving, pct: serving > 0 ? Math.round(100 * (m.available || 0) / serving) : null,
        next: m.next_recover_at || '', last: m.last_recover_at || '', unknown: m.unknown_recovery || 0,
        tier: tier, rank: HEALTH.tiers[tier].rank
      };
    });
    modelRows.sort(mhCompare);
    // strip line 1
    var counts = { DOWN: 0, CRIT: 0, WARN: 0, OK: 0, OFF: 0 };
    modelRows.forEach(function (m) { counts[m.tier]++; });
    var unhealthy = counts.DOWN + counts.CRIT + counts.WARN;
    var resTxt = '资源 <b>' + (p.available || 0) + '/' + (p.total || 0) + '</b> 可用 · 冷却 ' + (p.cooling || 0) + ' · 禁用 ' + (p.disabled || 0);
    if (unhealthy === 0) {
      var okCount = modelRows.length - counts.OFF;
      document.getElementById('strip-models').innerHTML = (counts.OFF > 0
        ? '可服务模型全部健康(' + okCount + ') · <span style="color:' + HEALTH.tiers.OFF.color + '">' + counts.OFF + ' ◌OFF</span>'
        : '全部 ' + modelRows.length + ' 个模型健康') + ' · ' + resTxt;
    } else {
      document.getElementById('strip-models').innerHTML = '模型: ' +
        ['DOWN', 'CRIT', 'WARN', 'OK'].map(function (tname) {
          var tt = HEALTH.tiers[tname];
          return '<span style="color:' + tt.color + '">' + counts[tname] + ' ' + tt.glyph + tname + '</span>';
        }).join(' · ') + (counts.OFF ? ' · ' + counts.OFF + ' ◌OFF' : '') + ' │ ' + resTxt;
    }
    paintModels();
    document.getElementById('dashboard').hidden = false;
  }

  function mhCompare(a, b) {
    if (a.rank !== b.rank) return a.rank - b.rank;
    var an = a.next ? new Date(a.next).getTime() : Infinity;
    var bn = b.next ? new Date(b.next).getTime() : Infinity;
    if (a.tier === 'DOWN') { if (an !== bn) return an - bn; }
    else if (a.tier === 'CRIT' || a.tier === 'WARN' || a.tier === 'OK') {
      if (a.pct !== b.pct) return (a.pct == null ? 101 : a.pct) - (b.pct == null ? 101 : b.pct);
      if (an !== bn) return an - bn;
    }
    if (a.provider !== b.provider) return a.provider < b.provider ? -1 : 1;
    return a.model < b.model ? -1 : (a.model > b.model ? 1 : 0);
  }

  function paintModels() {
    var now = Date.now();
    // strip line 2: soonest recovery among non-OK models with a known time
    var soon = null;
    modelRows.forEach(function (m) {
      if ((m.tier === 'DOWN' || m.tier === 'CRIT' || m.tier === 'WARN') && m.next) {
        var t = new Date(m.next).getTime();
        if (!soon || t < soon.t) soon = { t: t, provider: m.provider, model: m.model };
      }
    });
    var soonEl = document.getElementById('strip-soonest');
    soonEl.textContent = soon
      ? '最近恢复(非OK模型): ' + soon.provider + '·' + soon.model + '  约 ' + fmtDur(soon.t - now) + ' 后'
      : '';
    document.getElementById('mh-rows').innerHTML = modelRows.map(function (m) {
      var tt = HEALTH.tiers[m.tier];
      var avPct = m.total > 0 ? Math.round(100 * m.available / m.total) : 0;
      var coPct = m.total > 0 ? Math.round(100 * m.cooling / m.total) : 0;
      var cap = '<span class="track">' +
        '<span class="seg" style="width:' + avPct + '%;background:' + COLORS.available + '"></span>' +
        '<span class="seg" style="width:' + coPct + '%;background:' + COLORS.cooling + '"></span>' +
        '<span class="seg" style="width:' + Math.max(0, 100 - avPct - coPct) + '%;background:' + COLORS.disabled + '"></span></span>';
      var avail = m.available + '/' + m.serving + (m.disabled > 0 ? ' <span class="muted">+' + m.disabled + '禁</span>' : '');
      var pctCell = m.pct == null ? '—' : m.pct + '%';
      var nextCell = m.cooling === 0 ? '—' : (m.next ? fmtDur(new Date(m.next).getTime() - now) : '未知');
      var lastCell;
      if (m.cooling === 0) { lastCell = '—'; }
      else if (m.last) { lastCell = (m.unknown > 0 ? '≥' : '') + fmtDur(new Date(m.last).getTime() - now) + (m.unknown > 0 ? ' ?×' + m.unknown : ''); }
      else { lastCell = '未知 ?×' + m.unknown; }
      return '<tr data-provider="' + escapeHtml(m.provider) + '" data-model="' + escapeHtml(m.model) + '">' +
        '<td><span class="glyph" style="color:' + tt.color + '">' + tt.glyph + '</span> <span style="color:' + tt.color + '">' + m.tier + '</span></td>' +
        td(m.model) + '<td class="muted">' + escapeHtml(m.provider) + '</td>' +
        '<td>' + cap + '</td><td>' + avail + '</td>' + td(pctCell) + td(m.cooling) +
        td(nextCell) + '<td class="wide">' + escapeHtml(lastCell) + '</td></tr>';
    }).join('');
  }

  function applyDetailFilter() {
    var f = detailFilter;
    rowsData = f ? allRows.filter(function (r) { return r.provider === f.provider && r.model === f.model; }) : allRows;
    var chip = document.getElementById('mh-filter');
    if (f) {
      document.getElementById('mh-filter-label').textContent = f.provider + '·' + f.model;
      chip.hidden = false;
    } else {
      chip.hidden = true;
    }
    if (!rowsData.length) { els.table.hidden = true; els.empty.hidden = false; return; }
    els.empty.hidden = true; els.table.hidden = false;
    paint();
  }

  function render(accounts) {
    var rows = [];
    accounts.forEach(function (a) {
      (a.model_states || []).forEach(function (ms) {
        rows.push({
          provider: a.provider || '', auth: a.auth_index || a.id || '', email: a.email || a.label || '',
          model: ms.model || '', quota: !!ms.quota_exceeded, pending: !!ms.pending_verification, unavailable: !!ms.unavailable,
          status: ms.status || '', status_message: ms.status_message || '',
          reason: ms.reason_code || '', upstream: ms.upstream_model || '',
          reset_at: ms.reset_at || '', next: ms.next_retry_after || ''
        });
      });
    });
    // Soonest-recovery first; rows without a reset time sort last.
    rows.sort(function (x, y) {
      var xt = x.reset_at ? new Date(x.reset_at).getTime() : Infinity;
      var yt = y.reset_at ? new Date(y.reset_at).getTime() : Infinity;
      if (xt !== yt) return xt - yt;
      return (x.provider + '|' + x.auth + '|' + x.model).localeCompare(y.provider + '|' + y.auth + '|' + y.model);
    });
    allRows = rows;
    applyDetailFilter();
  }

  function paint() {
    var now = Date.now();
    els.rows.innerHTML = rowsData.map(function (r) {
      var cd = r.pending ? '已到预计恢复时间' : (r.reset_at ? fmtDur(new Date(r.reset_at).getTime() - now) : '');
      var acc = r.auth + (r.email ? ' (' + r.email + ')' : '');
      var st = r.status + (r.status_message ? ' / ' + r.status_message : '');
      return '<tr>' + td(r.provider) + td(acc) + td(r.model) +
        '<td>' + (r.quota ? '<span class="badge q">exhausted</span>' : (r.pending ? '<span class="badge p">待验证</span>' : '')) + '</td>' +
        td(r.unavailable ? '是' : '') + td(st) + td(r.reason) + td(r.upstream) +
        td(cd) + td(r.reset_at) + td(r.next) + '</tr>';
    }).join('');
  }
  function td(v) { return '<td>' + escapeHtml(v == null ? '' : String(v)) + '</td>'; }
  function escapeHtml(s) { return s.replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  els.save.addEventListener('click', saveKey);
  els.clear.addEventListener('click', clearKey);
  els.refresh.addEventListener('click', fetchData);
  els.auto.addEventListener('change', function () { if (els.auto.checked && firstSuccess) { startAuto(); } else { stopAuto(); } });
  document.getElementById('mh-rows').addEventListener('click', function (e) {
    var tr = e.target && e.target.closest ? e.target.closest('tr') : null;
    if (!tr) return;
    detailFilter = { provider: tr.getAttribute('data-provider'), model: tr.getAttribute('data-model') };
    applyDetailFilter();
  });
  document.getElementById('mh-filter-clear').addEventListener('click', function () {
    detailFilter = null;
    applyDetailFilter();
  });

  var existing = getStoredKey();
  if (existing) { els.key.value = existing; els.remember.checked = !!localStorage.getItem(KEY_NAME); fetchData(); }
  else { setStatus('请填写管理 key 后保存', ''); }
  setInterval(function () {          // Refresh countdowns every second.
    if (rowsData.length) paint();
    if (modelRows.length) paintModels();
  }, 1000);
})();
</script>
</body>
</html>
